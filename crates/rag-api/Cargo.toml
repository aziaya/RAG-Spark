[package]
name = "rag-api"
description = "HTTP API (axum) and admin CLI for the RAG server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rag-server"
path = "src/main.rs"

[features]
default = ["docling"]
# PDF/Office/image extraction through docling.rs (needs ONNX Runtime at run time).
docling = ["rag-core/docling"]

[dependencies]
rag-core = { path = "../rag-core" }
rag-types = { path = "../rag-types", features = ["openapi"] }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
# single-pane admin UI (`rag-server classic`)
comfy-table = "8"
console = "0.16"
dialoguer = { version = "0.12", features = ["history", "completion", "fuzzy-select"] }
indicatif = "0.18"
termimad = "0.35"
