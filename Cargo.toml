[workspace]
resolver = "2"
members = ["crates/rag-types", "crates/rag-core", "crates/rag-api", "crates/rag-tui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.92" # docling 1.103 (server only) requires it; the TUI itself builds on older toolchains

[profile.dev]
# smaller build artifacts; backtraces still show file and line
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
